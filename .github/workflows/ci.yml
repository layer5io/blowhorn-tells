name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Syntax check
        run: pnpm check
      - name: Unit tests
        run: pnpm test
      - name: Worker end-to-end tests
        run: pnpm test:e2e
        env:
          CI: 'true'
