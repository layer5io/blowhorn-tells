name: Deploy to Cloudflare Workers

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Cloudflare credentials not configured
        if: env.HAS_CLOUDFLARE != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set on this repository, so nothing was deployed."
      - uses: actions/checkout@v4
        if: env.HAS_CLOUDFLARE == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_CLOUDFLARE == 'true'
        with:
          node-version: '24'
      - name: Install dependencies
        if: env.HAS_CLOUDFLARE == 'true'
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Test before deploy
        if: env.HAS_CLOUDFLARE == 'true'
        run: pnpm check && pnpm test && pnpm test:e2e
        env:
          CI: 'true'
      - name: Deploy to Cloudflare Workers
        if: env.HAS_CLOUDFLARE == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: deploy
